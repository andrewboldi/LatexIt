<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Insert Complex LaTeX</title>
    <link rel="stylesheet" href="insert.css" />
  </head>
  <body>
    <main>
      <h1>Insert Complex LaTeX</h1>
      <section class="dialog-content">
        <p>
          Edit the LaTeX document below. The visible result will be inserted at the
          current cursor position in the compose editor.
        </p>
        <p>
          If a LaTeX image is selected in the compose body, this dialog edits and
          replaces that formula in place.
        </p>

        <section class="history" id="historySection">
          <label for="formulaHistory">Recent formulas in this compose window</label>
          <select id="formulaHistory" size="4"></select>
          <section class="actions compact-actions">
            <button id="loadHistory" type="button" disabled>Load selected formula</button>
            <button id="refreshHistory" type="button">Refresh history</button>
          </section>
        </section>

        <textarea id="latexExpression" rows="14"></textarea>

        <section class="actions compact-actions">
          <button id="resetTemplate" type="button">Load default template</button>
        </section>

        <section class="row">
          <label class="checkbox">
            <input id="autodpi" type="checkbox" />
            Adapt image resolution automatically to font size
          </label>
          <label>
            Font size
            <input id="fontPx" type="number" min="1" step="1" />
          </label>
        </section>
      </section>

      <section class="actions footer-actions">
        <button id="cancel" type="button">Cancel</button>
        <button id="insert" type="button">Insert at cursor position</button>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script src="insert.js"></script>
  </body>
</html>
